<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emoji Memory Match</title>
  <!--
    Emoji Memory Match — beginner-friendly web game
    ------------------------------------------------
    Highlights:
    • Pure HTML/CSS/JS (single file)
    • Clean modular JS, well-commented
    • Clear mechanics, timer + moves + best score per difficulty (localStorage)
    • Simple, attractive UI with smooth card flips

    How to customize quickly:
    - Change the emoji pool in JS (EMOJI_POOL)
    - Tweak difficulties in DIFFICULTIES
    - Adjust colors in :root CSS variables
  -->
  <style>
    :root {
      --bg: #0f1222;           /* page background */
      --panel: #151936;        /* UI panels */
      --accent: #8b7bff;       /* accent color */
      --accent-2: #00e0a4;     /* secondary accent */
      --text: #e8e9f1;         /* primary text */
      --muted: #a4a7c3;        /* muted text */
      --card-front: #1b2047;   /* card face-down */
      --card-back: #232a62;    /* card face-up background */
      --good: #11d67b;
      --bad: #ff6b6b;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 18px;
      --speed: 180ms;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 10% -10%, #1b2047 0%, transparent 50%),
                  radial-gradient(1000px 600px at 120% 110%, #103b48 0%, transparent 50%),
                  var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 18px;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
    }

    .panel {
      background: linear-gradient(180deg, #151936, #101431);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .title { font-size: 22px; font-weight: 800; letter-spacing: .2px; }
    .badge { font-size: 12px; color: var(--muted); border: 1px solid rgba(255,255,255,.08); padding: 4px 8px; border-radius: 999px; }

    .controls { display: grid; gap: 12px; }

    .field { display: grid; gap: 6px; }
    .label { font-size: 12px; color: var(--muted); }

    select, button, .stat {
      width: 100%;
      background: #0f1433;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.08);
      padding: 12px 14px;
      border-radius: 12px;
      outline: none;
    }

    select:focus, button:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,123,255,.2); }

    button {
      background: linear-gradient(180deg, #1f2454, #161a40);
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--speed), filter var(--speed), box-shadow var(--speed);
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .stat { display: grid; gap: 6px; background: #101437; }
    .stat .label { font-size: 11px; }
    .stat .value { font-size: 18px; font-weight: 800; letter-spacing: .3px; }

    .grid.panel { padding: 16px; }

    .grid-header { display:flex; align-items:center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .difficulty-pill { font-size: 12px; color: var(--accent-2); background: rgba(0,224,164,.08); border: 1px solid rgba(0,224,164,.25); padding: 6px 10px; border-radius: 999px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* default; updated via inline style in JS for other difficulties */
      gap: 12px;
      user-select: none;
    }

    .card {
      position: relative;
      width: 100%; aspect-ratio: 1/1;
      perspective: 800px;
    }

    .card-inner {
      position:absolute; inset:0;
      border-radius: 14px;
      transform-style: preserve-3d;
      transition: transform 260ms ease;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .card.is-flipped .card-inner { transform: rotateY(180deg); }
    .card.is-matched .card-inner { box-shadow: 0 0 0 2px var(--good), 0 8px 20px rgba(17,214,123,.3); }

    .face {
      position:absolute; inset:0;
      display:grid; place-items:center;
      border-radius: 14px;
      backface-visibility: hidden;
      font-size: clamp(26px, 6vw, 44px);
    }

    .front { /* face-down */
      background: linear-gradient(160deg, var(--card-front), #0f1433);
      border: 1px solid rgba(255,255,255,.07);
    }

    .back { /* face-up */
      background: radial-gradient(800px 300px at 20% 10%, rgba(255,255,255,.08), transparent 40%),
                  linear-gradient(160deg, var(--card-back), #1a2157);
      border: 1px solid rgba(255,255,255,.09);
      transform: rotateY(180deg);
    }

    /* Win overlay */
    .overlay {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: rgba(4,7,20,.6);
      opacity: 0; pointer-events: none; transition: opacity 200ms ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .dialog {
      width: min(520px, 92vw);
      background: linear-gradient(180deg, #14183a, #0c1031);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px; padding: 20px; box-shadow: var(--shadow);
      text-align: center; display: grid; gap: 10px;
    }
    .dialog h2 { margin: 6px 0; font-size: 24px; }
    .dialog p { margin: 0; color: var(--muted); }

    .row { display:flex; gap:10px; justify-content:center; }
    .chip { background:#0f1433; border:1px solid rgba(255,255,255,.08); padding:8px 12px; border-radius:999px; font-weight:700; }

    .footer { text-align:center; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .footer a { color: var(--accent-2); text-decoration:none; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar / Controls -->
    <aside class="panel">
      <div class="header">
        <div class="title">🧠 Emoji Memory Match</div>
        <span class="badge">Vanilla JS</span>
      </div>

      <div class="controls">
        <div class="field">
          <label class="label" for="difficulty">Difficulty</label>
          <select id="difficulty" aria-label="Select difficulty">
            <!-- values map to DIFFICULTIES keys in JS -->
            <option value="easy">Easy (4 × 4)</option>
            <option value="medium">Medium (5 × 4)</option>
            <option value="hard">Hard (6 × 4)</option>
          </select>
        </div>

        <div class="field">
          <button id="newGameBtn" type="button">🔄 New Game</button>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="label">⏱️ Time</div>
            <div class="value" id="time">00:00</div>
          </div>
          <div class="stat">
            <div class="label">🎯 Moves</div>
            <div class="value" id="moves">0</div>
          </div>
          <div class="stat">
            <div class="label">🏆 Best (this level)</div>
            <div class="value" id="best">—</div>
          </div>
          <div class="stat">
            <div class="label">✅ Pairs Found</div>
            <div class="value" id="found">0</div>
          </div>
        </div>

        <div class="footer">Built with ❤️ using HTML, CSS, and JavaScript.</div>
      </div>
    </aside>

    <!-- Game Grid -->
    <main class="panel grid">
      <div class="grid-header">
        <div class="title">Match the pairs!</div>
        <span id="diffPill" class="difficulty-pill">Easy</span>
      </div>
      <div id="grid" class="grid" aria-live="polite" aria-label="Game board"></div>
    </main>
  </div>

  <!-- Win dialog overlay -->
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="dialog">
      <h2 id="winTitle">🎉 You matched them all!</h2>
      <p id="winStats">Time 00:00 • Moves 0</p>
      <div class="row">
        <button id="playAgainBtn" type="button">Play Again</button>
        <button id="changeLevelBtn" type="button">Change Level</button>
      </div>
    </div>
  </div>

  <script>
    // -----------------------------
    // Configuration
    // -----------------------------
    const DIFFICULTIES = {
      easy:   { cols: 4, rows: 4 }, // 16 cards -> 8 pairs
      medium: { cols: 5, rows: 4 }, // 20 cards -> 10 pairs
      hard:   { cols: 6, rows: 4 }, // 24 cards -> 12 pairs
    };

    // A fun, diverse emoji pool — feel free to replace with your theme!
    const EMOJI_POOL = [
      '🍎','🍊','🍋','🍉','🍇','🍓','🍒','🍍','🥝','🥥','🥑','🌶️','🍔','🍕','🍟','🌮',
      '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐷','🐸','🐵','🐤','🦆',
      '⚽','🏀','🏈','⚾','🎾','🏐','🎱','🥏','🏓','🏸','🥊','⛳','🎯','🎮','🎲','🧩',
      '🚗','🚌','🚲','✈️','🚀','🛸','🚁','🚂','⛵','🚤','🛴','🏍️','🚑','🚒','🚜','🚕'
    ];

    // -----------------------------
    // Utility helpers
    // -----------------------------
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    const pad2 = n => String(n).padStart(2, '0');

    function shuffle(array) {
      // Fisher–Yates shuffle
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // -----------------------------
    // Game state
    // -----------------------------
    const state = {
      levelKey: 'easy',
      gridEl: null,
      lock: false,
      first: null,
      second: null,
      foundPairs: 0,
      totalPairs: 0,
      moves: 0,
      timeMs: 0,
      timerId: null,
      hasStarted: false,
    };

    // -----------------------------
    // Timer logic
    // -----------------------------
    function startTimer() {
      if (state.timerId) return;
      const t0 = performance.now() - state.timeMs;
      state.timerId = setInterval(() => {
        state.timeMs = performance.now() - t0;
        renderTime();
      }, 250);
    }

    function stopTimer() {
      clearInterval(state.timerId);
      state.timerId = null;
    }

    function resetTimer() {
      stopTimer();
      state.timeMs = 0;
      renderTime();
    }

    function renderTime() {
      const secs = Math.floor(state.timeMs / 1000);
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      $('#time').textContent = `${pad2(m)}:${pad2(s)}`;
    }

    // -----------------------------
    // Local storage for best times
    // -----------------------------
    function bestKey() { return `mm_best_${state.levelKey}`; }

    function loadBest() {
      const ms = +localStorage.getItem(bestKey());
      if (!ms) return null;
      const secs = Math.floor(ms / 1000);
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${pad2(m)}:${pad2(s)}`;
    }

    function maybeSaveBest() {
      const current = state.timeMs|0;
      const key = bestKey();
      const prev = +localStorage.getItem(key) || Infinity;
      if (current < prev) {
        localStorage.setItem(key, String(current));
      }
    }

    function renderBest() {
      $('#best').textContent = loadBest() || '—';
    }

    // -----------------------------
    // Board setup
    // -----------------------------
    function makeDeck(pairs) {
      // Pick N emojis and duplicate to make pairs
      const chosen = shuffle(EMOJI_POOL.slice()).slice(0, pairs);
      const deck = shuffle(chosen.concat(chosen));
      return deck;
    }

    function createCard(emoji, index) {
      const card = document.createElement('button');
      card.className = 'card';
      card.setAttribute('type', 'button');
      card.setAttribute('aria-label', 'Memory card');
      card.dataset.value = emoji;
      card.dataset.index = index;
      card.innerHTML = `
        <div class="card-inner">
          <div class="face front"></div>
          <div class="face back">${emoji}</div>
        </div>
      `;
      card.addEventListener('click', onCardClick);
      return card;
    }

    function layoutGrid(cols) {
      const grid = $('#grid');
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    }

    function resetStateForNewGame() {
      state.lock = false;
      state.first = null; state.second = null;
      state.foundPairs = 0; state.moves = 0; state.hasStarted = false;
      $('#found').textContent = '0';
      $('#moves').textContent = '0';
      resetTimer();
    }

    function newGame(levelKey = state.levelKey) {
      state.levelKey = levelKey;
      const lvl = DIFFICULTIES[levelKey];
      const totalCards = lvl.cols * lvl.rows;
      const pairs = totalCards / 2;
      state.totalPairs = pairs;

      resetStateForNewGame();
      renderBest();

      $('#diffPill').textContent =
        levelKey.charAt(0).toUpperCase() + levelKey.slice(1) + ` (${lvl.cols}×${lvl.rows})`;

      const grid = $('#grid');
      grid.replaceChildren();
      layoutGrid(lvl.cols);

      const deck = makeDeck(pairs);
      deck.forEach((emoji, i) => grid.appendChild(createCard(emoji, i)));
    }

    // -----------------------------
    // Interaction logic
    // -----------------------------
    function flipUp(card) { card.classList.add('is-flipped'); }
    function flipDown(card) { card.classList.remove('is-flipped'); }

    function onCardClick(e) {
      const card = e.currentTarget;
      if (state.lock) return;               // ignore during compare
      if (card.classList.contains('is-flipped')) return; // already up

      // Start timer on the very first move
      if (!state.hasStarted) { startTimer(); state.hasStarted = true; }

      flipUp(card);

      if (!state.first) {
        state.first = card;
        return;
      }

      state.second = card;
      state.lock = true; // temporarily lock input while we compare
      state.moves += 1;
      $('#moves').textContent = String(state.moves);

      const match = state.first.dataset.value === state.second.dataset.value;
      if (match) {
        // Mark as matched, keep face-up
        [state.first, state.second].forEach(c => c.classList.add('is-matched'));
        afterCompare(true);
      } else {
        // Flip back after a short delay
        setTimeout(() => {
          flipDown(state.first);
          flipDown(state.second);
          afterCompare(false);
        }, 650);
      }
    }

    function afterCompare(matched) {
      if (matched) {
        state.foundPairs += 1;
        $('#found').textContent = String(state.foundPairs);
      }
      // Clear selection and unlock
      state.first = null; state.second = null; state.lock = false;

      // Win check
      if (state.foundPairs === state.totalPairs) {
        stopTimer();
        maybeSaveBest();
        showWin();
        renderBest();
      }
    }

    // -----------------------------
    // Win overlay
    // -----------------------------
    function showWin() {
      const secs = Math.floor(state.timeMs / 1000);
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      $('#winStats').textContent = `Time ${pad2(m)}:${pad2(s)} • Moves ${state.moves}`;
      $('#overlay').classList.add('show');
    }

    function hideWin() { $('#overlay').classList.remove('show'); }

    // -----------------------------
    // Wiring UI controls
    // -----------------------------
    function initUI() {
      $('#newGameBtn').addEventListener('click', () => { hideWin(); newGame(state.levelKey); });
      $('#difficulty').addEventListener('change', (e) => {
        const key = e.target.value;
        hideWin();
        newGame(key);
      });
      $('#playAgainBtn').addEventListener('click', () => { hideWin(); newGame(state.levelKey); });
      $('#changeLevelBtn').addEventListener('click', () => {
        hideWin();
        const select = $('#difficulty');
        // rotate to next option for quick retry with variety
        const i = select.selectedIndex;
        select.selectedIndex = (i + 1) % select.options.length;
        newGame(select.value);
      });
    }

    // -----------------------------
    // Boot
    // -----------------------------
    window.addEventListener('DOMContentLoaded', () => {
      initUI();
      newGame('easy');
      // Ensure the <select> reflects current level
      $('#difficulty').value = 'easy';
    });
  </script>
</body>
</html>
